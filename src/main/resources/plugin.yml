name: AuctionHouse
version: '${project.version}'
main: me.outsid.auctionHouse.AuctionHouse
api-version: '1.21'
load: POSTWORLD

libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.xerial:sqlite-jdbc:3.45.1.0

commands:
  auction:
    description: Open Auction
    usage: /<command> [sell <prix>]
    aliases: [ah]
  ecoadd:
    description: Add money (In the console only)
    usage: /ecoadd <player> <amount>
  money:
    description: Check your balance or another player's balance
    aliases: [bal, balance]
    usage: /money [player]